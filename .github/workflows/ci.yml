name: Native compatibility
on:
  push:
    branches-ignore: ['release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build unchanged GNU timeout
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/reports
          python3 tools/timeoutctl.py build 2>&1 | tee .build/reports/build.log
      - name: Run upstream and repository test gates
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            python3 tools/timeoutctl.py test --root-pid-namespace 2>&1 | tee .build/reports/test.log
          else
            python3 tools/timeoutctl.py test 2>&1 | tee .build/reports/test.log
          fi
      - name: Package tested binary and corresponding source
        run: python3 tools/timeoutctl.py package
      - name: Smoke-test extracted distribution
        shell: bash
        run: |
          mkdir .build/unpacked
          tar -xzf dist/timeout-*.tar.gz -C .build/unpacked
          candidate=$(find "$PWD/.build/unpacked" -path '*/bin/timeout' -type f)
          test -n "$candidate"
          TIMEOUT_BIN="$candidate" TIMEOUT_REQUIRE_VERSION=9.12 python3 tools/run_tests.py
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L "$candidate" | tee .build/reports/linkage.txt
            if grep -E '/opt/homebrew|/usr/local|@rpath' .build/reports/linkage.txt; then exit 1; fi
          else
            ldd "$candidate" | tee .build/reports/linkage.txt
            if grep 'not found' .build/reports/linkage.txt; then exit 1; fi
          fi
      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Retain actual results and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.runner }}
          include-hidden-files: true
          path: |
            .build/reports/
            .build/work/config.log
            .build/work/tests/timeout/*.log
            .build/work/tests/timeout/*.trs
            .build/work/tests/test-suite.log
          retention-days: 14
  homebrew:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install this exact candidate formula in a disposable tap
        shell: bash
        run: |
          brew tap-new ci/timeout
          cp Formula/timeout.rb "$(brew --repository ci/timeout)/Formula/timeout.rb"
          if [ -n "$(brew list --versions coreutils 2>/dev/null)" ]; then
            brew unlink coreutils
          fi
          brew install --build-from-source ci/timeout/timeout
          brew test ci/timeout/timeout
          TIMEOUT_BIN="$(brew --prefix ci/timeout/timeout)/bin/timeout" TIMEOUT_REQUIRE_VERSION=9.12 python3 tools/run_tests.py
      - name: Retain Homebrew evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-${{ matrix.runner }}
          include-hidden-files: true
          path: |
            .build/reports/
            ~/Library/Logs/Homebrew/timeout/
          retention-days: 14
