name: Native compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build unchanged GNU timeout
        run: python3 tools/timeoutctl.py build
      - name: Run every upstream timeout test
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          import timeoutctl
          timeoutctl.test_upstream(root_pid_namespace=sys.platform.startswith('linux'))
          PY
      - name: Retain actual results and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.runner }}
          include-hidden-files: true
          path: |
            .build/reports/
            .build/work/config.log
            .build/work/tests/timeout/*.log
            .build/work/tests/timeout/*.trs
            .build/work/tests/test-suite.log
          retention-days: 14
