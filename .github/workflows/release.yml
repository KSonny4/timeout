name: Release
on:
  workflow_dispatch:
  push:
    branches: ['release/**']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.publish.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: evidence-*
          path: evidence
      - name: Verify manifest and publish versioned release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release exists; bump VERSION rather than replacing published assets.' >&2
            exit 1
          fi
          test "$(find dist -name '*.tar.gz' -type f | wc -l)" -eq 4
          (cd dist; cat ./*.sha256 > SHA256SUMS; sha256sum -c SHA256SUMS)
          tar -czf dist/verification-evidence.tar.gz evidence
          cp install.sh dist/install.sh
          printf 'GNU timeout %s, standalone packaging %s.\n\nNative GNU and repository tests plus Homebrew gates passed for this commit.\nGNU source, COPYING and build recipe are included in every platform archive.\nSee docs/compatibility.md for platform and English-diagnostic limitations.\n\nCommit: %s\nVerification run: %s/%s/actions/runs/%s\n' \
            "$(python3 -c 'import json; print(json.load(open("upstream.json"))["version"])')" \
            "$version" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "timeout $version" \
            --notes-file dist/release-notes.md dist/*.tar.gz dist/SHA256SUMS dist/install.sh
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  public-install:
    needs: publish
    uses: ./.github/workflows/public-install.yml
    with:
      version: ${{ needs.publish.outputs.version }}
