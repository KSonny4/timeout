name: Published installation
on:
  push:
    branches-ignore: ['release/**']
    paths:
      - .github/workflows/public-install.yml
      - .github/workflows/release.yml
      - tests/**
      - tools/run_tests.py
  workflow_dispatch:
    inputs:
      version:
        description: 'Published X.Y.Z version (empty selects latest stable release)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: public-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Resolve a published release and installer digest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            endpoint="tags/v$REQUESTED_VERSION"
          else
            endpoint=latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$endpoint" > "$RUNNER_TEMP/published-release.json"
          python3 - <<'PY'
          import json, os, pathlib, re
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'published-release.json').read_text())
          tag = release['tag_name']
          if release['draft'] or release['prerelease'] or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('A stable, published numeric release tag is required')
          assets = [a for a in release['assets'] if a['name'] == 'install.sh' and a['state'] == 'uploaded']
          if len(assets) != 1 or not re.fullmatch(r'sha256:[a-f0-9]{64}', assets[0].get('digest') or ''):
              raise SystemExit('Exactly one released installer with a SHA-256 digest is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"tag={tag}\ninstaller_sha256={assets[0]['digest'].split(':', 1)[1]}\n")
          print(f"Checking published release {tag}, release ID {release['id']}")
          PY
      - name: Check out the verification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out the released source separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-source
          persist-credentials: false
      - name: Record harness and release identities
        shell: bash
        run: |
          set -euo pipefail
          printf 'HARNESS_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA=%s\n' "$(git -C release-source rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download and verify the public installer
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INSTALLER_SHA256: ${{ steps.release.outputs.installer_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/timeout-public-reports"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 2 \
            --output "$RUNNER_TEMP/timeout-published-install.sh" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/install.sh"
          python3 - <<'PY'
          import hashlib, os, pathlib
          script = pathlib.Path(os.environ['RUNNER_TEMP']) / 'timeout-published-install.sh'
          actual = hashlib.sha256(script.read_bytes()).hexdigest()
          if actual != os.environ['INSTALLER_SHA256']:
              raise SystemExit('Published installer digest mismatch')
          print(f'Published installer SHA-256 verified: {actual}')
          PY
          cmp release-source/install.sh "$RUNNER_TEMP/timeout-published-install.sh"
      - name: Install public binary and run the current contract suite
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/timeout public install"
          reports="$RUNNER_TEMP/timeout-public-reports"
          test ! -e "$prefix"
          sh "$RUNNER_TEMP/timeout-published-install.sh" --version "${RELEASE_TAG#v}" --prefix "$prefix" \
            2>&1 | tee "$reports/install.log"
          export TIMEOUT_BIN="$prefix/bin/timeout"
          export TIMEOUT_REQUIRE_VERSION
          TIMEOUT_REQUIRE_VERSION=$(python3 -c 'import json; print(json.load(open("release-source/upstream.json"))["version"])')
          "$TIMEOUT_BIN" --version | tee "$reports/version.txt"
          python3 tools/run_tests.py 2>&1 | tee "$reports/tests.log"
          python3 -c 'import hashlib, os; print(hashlib.sha256(open(os.environ["TIMEOUT_BIN"], "rb").read()).hexdigest())' > "$reports/binary-before.sha256"
          if sh "$RUNNER_TEMP/timeout-published-install.sh" --version "${RELEASE_TAG#v}" --prefix "$prefix" > "$reports/reinstall.log" 2>&1; then
            echo 'Reinstallation unexpectedly overwrote an existing executable' >&2
            exit 1
          fi
          grep -F 'refusing to overwrite' "$reports/reinstall.log"
          python3 -c 'import hashlib, os; print(hashlib.sha256(open(os.environ["TIMEOUT_BIN"], "rb").read()).hexdigest())' > "$reports/binary-after.sha256"
          cmp "$reports/binary-before.sha256" "$reports/binary-after.sha256"
          python3 - <<'PY'
          import json, os, pathlib, platform
          report = {
              'release': os.environ['RELEASE_TAG'],
              'release_sha': os.environ['RELEASE_SHA'], 'harness_sha': os.environ['HARNESS_SHA'],
              'system': platform.system(), 'machine': platform.machine(),
              'gnu_version': os.environ['TIMEOUT_REQUIRE_VERSION'],
              'installed_binary_bytes': pathlib.Path(os.environ['TIMEOUT_BIN']).stat().st_size,
              'public_download_install_passed': True, 'overwrite_refused': True,
              'contract': json.loads(pathlib.Path('.build/reports/contract.json').read_text()),
          }
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'timeout-public-reports/public-install.json'
          path.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Repeat signal cases without masking failures
        shell: bash
        run: |
          set -euo pipefail
          export TIMEOUT_BIN="$RUNNER_TEMP/timeout public install/bin/timeout"
          export TIMEOUT_REQUIRE_VERSION
          TIMEOUT_REQUIRE_VERSION=$(python3 -c 'import json; print(json.load(open("release-source/upstream.json"))["version"])')
          python3 - <<'PYCODE'
          import json, os, pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path('tests').resolve()))
          from test_timeout import TimeoutContract
          names = [
              'test_trapped_signal_preserves_custom_exit',
              'test_external_term_is_forwarded_without_timeout_status',
              'test_custom_signal_name_is_delivered',
              'test_signal_exit_fixture_avoids_interpreter_shutdown',
          ]
          repetitions = 25
          suite = unittest.TestSuite(TimeoutContract(name) for _ in range(repetitions) for name in names)
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          report = {
              'repetitions': repetitions, 'methods': names, 'tests_run': result.testsRun,
              'failures': len(result.failures), 'errors': len(result.errors), 'skips': len(result.skipped),
              'release_sha': os.environ['RELEASE_SHA'], 'harness_sha': os.environ['HARNESS_SHA'],
          }
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'timeout-public-reports/signal-stress.json'
          path.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PYCODE
      - name: Retain public-install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-install-${{ matrix.runner }}
          include-hidden-files: true
          path: |
            .build/reports/
            ${{ runner.temp }}/timeout-public-reports/
          retention-days: 14
